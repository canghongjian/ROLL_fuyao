defaults:
  - ../config/traj_envs_gem_qa@_here_

hydra:
  run:
    dir: .
  output_subdir: null

pretrain: /publicdata/huggingface.co/Qwen/Qwen3-4B-Base
reward_pretrain: /publicdata/huggingface.co/Qwen/Qwen3-4B-Base

exp_name: roll_${oc.env:BIFROST_JOB_NAME}_qwen3-base-4B-agentic-search-r1-tool1
seed: 42
local_save_path: /log/roll_output
logging_dir: ${local_save_path}/logs
output_dir: ${oc.env:CPFS_DIR}/roll_output/${exp_name}
system_envs:
  USE_MODELSCOPE: '1'
  ROLL_LOG_DIR: ${logging_dir}

checkpoint_config:
  type: file_system
  output_dir: ${output_dir}/roll_ckpt
  convert_then_eval: false # 新增megatron训完后自动转hf并自动提deepinsight任务,注意周期是save steps
  # base_eval_config_path: fuyao_patch/deepinsight_eval_base_config.json
  # keep_megatron_files: false 
  # async_upload: false # must be false if set convert then eval to avoid original megatron uploading incompletely
  # deepinsight_args:
  #   system_envs: ENABLE_THINKING=true EVALS_THREADS=128 JUDGE_THREADS=128 MAX_TOKENS=30000 EVAL_REPEAT_NUM=16 TEMPERATURE=0.7 TOP_P=1 TOP_K=20
  #   eval_datasets: aime_2024 aime_2025 math_500 livecodebench_v5 gpqa_diamond
  #   launch_args: --eval_tp_size 4 --judge_tp_size 4

track_with: deepinsight_swanlab  
tracker_kwargs:  
  login_kwargs:  
    api_key: ${oc.env:SWANLAB_API_KEY}  # 您的SwanLab API密钥  
  project: roll-experiments  # 项目名称  
  logdir: ${output_dir}/swanlog  # 日志存储目录  
  experiment_name: ${exp_name}  # 实验名称  
  tags:  # 实验标签  
    - qwen3_4b  
    - search_r1  
    - reinforce

num_gpus_per_node: 8

max_steps: 1024
save_steps: 100
logging_steps: 1
eval_steps: 10
resume_from_checkpoint: false

rollout_batch_size: 128
val_batch_size: 128
sequence_length: 12800

advantage_clip: 20
ppo_epochs: 1
adv_estimator: "reinforce"

#pg_clip: 0.1
#dual_clip_loss: True
init_kl_coef: 0.0
whiten_advantages: true
entropy_loss_coef: 0
max_grad_norm: 1.0


actor_train:
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    warmup_steps: 10
    lr_scheduler_type: cosine
  strategy_args:
#    strategy_name: deepspeed_train
#    strategy_config: ${deepspeed_zero3}
    strategy_name: megatron_train
    strategy_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      use_distributed_optimizer: true
      recompute_granularity: full
  device_mapping: list(range(0,8))
  infer_batch_size: 1

actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: ${max_tokens_per_step} # single-turn response length
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: 1
    stop_strings: ["</search>"]
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.8
      block_size: 16
      load_format: auto
  device_mapping: list(range(0,8))

reference:
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  strategy_args:
    strategy_name: hf_infer
    strategy_config: ~
  device_mapping: list(range(0,8))
  infer_batch_size: 1

reward_normalization:
  grouping: batch # 可以tags(env_type)/traj_group_id(group)/batch(rollout_batch)... group_by计算reward/adv
  method: identity # asym_clip / identity / mean_std

train_env_manager:
  max_env_num_per_worker: 32
  num_env_groups: 128
  # under the same group, the env config and env seed are ensured to be equal
  group_size: 1
  tags: [Rlinf_search_r1]
  num_groups_partition: [128] # If not set, all env names divide nums equally. Under the same group, the env config and env seed (prompt) are equal in each generation

val_env_manager:
  max_env_num_per_worker: 32
  num_env_groups: 128
  group_size: 1 # should be set to 1 because val temperature is set to 0 and same prompt leads to same output
  tags: [musique_search_r1_val]
  num_groups_partition: [128] # TODO: If not set, all env names divide nums equally. Under the same group, the env config and env seed (prompt) are equal in each generation


# Here, you can override variables defined in the imported envs. max_tokens_per_step: 128 in custom_env.SimpleSokoban, here replaced by 64
max_tokens_per_step: 4096

custom_envs:
  Rlinf_search_r1:
    ${gem_qa.Rlinf_search_r1}
  Rlinf_search_r1_val:
    ${gem_qa.Rlinf_search_r1_val}
  musique_search_r1_val:
    ${gem_qa.musique_search_r1_val}
