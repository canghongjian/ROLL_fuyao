hydra:
  run:
    dir: .
  output_subdir: null

pretrain: /publicdata/huggingface.co/Qwen/Qwen3-30B-A3B
reward_pretrain: /publicdata/huggingface.co/Qwen/Qwen3-30B-A3B

exp_name: roll_${oc.env:BIFROST_JOB_NAME}_qwen3-30BA3B-rlvr-deepmath
seed: 42
local_save_path: /log/roll_output
logging_dir: ${local_save_path}/logs
output_dir: ${oc.env:CPFS_DIR}/roll_output/${exp_name}
save_logging_board_dir: ${output_dir}/data_saved
system_envs:
  USE_MODELSCOPE: '1'

checkpoint_config:
  type: file_system
  output_dir: ${output_dir}/roll_ckpt
  convert_then_eval: false # 新增megatron训完后自动转hf并自动提deepinsight任务
  base_eval_config_path: fuyao_patch/deepinsight_eval_base_config.json
  keep_megatron_files: false 
  async_upload: false # must be false if set convert then eval to avoid original megatron uploading incompletely
  deepinsight_args:
    system_envs: ENABLE_THINKING=true EVALS_THREADS=128 JUDGE_THREADS=128 MAX_TOKENS=8192 EVAL_REPEAT_NUM=8 TEMPERATURE=1.0 TOP_P=0.95
    eval_datasets: aime_2024 aime_2025 math_500 livecodebench_v5 gpqa_diamond
    launch_args: --eval_tp_size 4 --judge_tp_size 4

track_with: deepinsight_swanlab  
tracker_kwargs:  
  login_kwargs:  
    api_key: ${oc.env:SWANLAB_API_KEY}  # 您的SwanLab API密钥  
  project: roll-experiments  # 项目名称  
  logdir: ${output_dir}/swanlog  # 日志存储目录  
  experiment_name: ${exp_name}  # 实验名称  
  tags:  # 实验标签  
    - roll  
    - rlvr  
    - qwen3_moe

num_gpus_per_node: 8

max_steps: 500
save_steps: 100
logging_steps: 1
eval_steps: 20
resume_from_checkpoint: false


rollout_batch_size: 32  # prompt
prompt_length: 1024
response_length: 32768

num_return_sequences_in_group: 8
ppo_epochs: 1
adv_estimator: "grpo"
use_kl_loss: true
kl_loss_coef: 0.001
loss_agg_mode: "seq-mean-token-mean"

# clip
value_clip: 0.5
reward_clip: 10
advantage_clip: 2.0
dual_clip_loss: true

# normalize
norm_mean_type: ~
norm_std_type: ~


# reward
add_token_level_kl: false

# advantage
whiten_advantages: true

# dynamic sampling scheduler
# use_additional_prompts: true
# max_running_requests: 256
# is_num_return_sequences_expand: false

validation:
  data_args:
    template: qwen2_5
    file_name:
      - data/math_benchmarks.jsonl
  generating_args:
    top_p: 0.6
    top_k: 50
    num_beams: 1
    temperature: 0.6
    num_return_sequences: 1

actor_train:
  model_args:
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 64
    warmup_steps: 20
    num_train_epochs: 50
  data_args:
    template: qwen3
    file_name:
      - /workspace/zhangjh37@xiaopeng.com/tmp/deepmath_math_rule_20k.jsonl
    domain_interleave_probs:
      math_rule: 1.0
    messages: messages
    interleave_probs: "1.0"
    preprocessing_num_workers: 16
  strategy_args:
    strategy_name: megatron_train
    strategy_config:
      tensor_model_parallel_size: 2
      pipeline_model_parallel_size: 1
      virtual_pipeline_model_parallel_size: null
      expert_model_parallel_size: 4
      context_parallel_size: 4
      use_distributed_optimizer: true
      sequence_parallel: true
      moe_token_dispatcher_type: "alltoall"
      moe_grouped_gemm: true
      moe_layer_recompute: true
  device_mapping: list(range(0,32))
  infer_batch_size: 1

actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: ${response_length}
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: ${num_return_sequences_in_group}
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: sglang
    strategy_config:
      mem_fraction_static: 0.7
      load_format: dummy
  num_gpus_per_worker: 4
  device_mapping: list(range(0,32))
  infer_batch_size: 1

reference:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: megatron_infer
    strategy_config:
      tensor_model_parallel_size: 2
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 4
      context_parallel_size: 4
      sequence_parallel: true
      moe_token_dispatcher_type: "alltoall"
      moe_grouped_gemm: true
  device_mapping: list(range(0,32))
  infer_batch_size: 1

rewards:
  math_rule:
    worker_cls: roll.pipeline.rlvr.rewards.math_rule_reward_worker.MathRuleRewardWorker
    model_args:
      model_name_or_path: ${reward_pretrain}
    data_args:
      template: qwen3
    tag_included: [deepmath_math_rule_20k]
    world_size: 32
    infer_batch_size: 1